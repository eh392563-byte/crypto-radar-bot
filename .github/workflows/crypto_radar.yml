name: Crypto Radar Bot Run

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: কোড চেকআউট করা
        uses: actions/checkout@v4

      - name: পাইথন সেটআপ করা
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: লাইব্রেরি ইনস্টল করা
        run: |
          pip install -r requirements.txt

      - name: ক্রিপ্টো রাডার স্ক্রিপ্ট চালানো
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python main.py
